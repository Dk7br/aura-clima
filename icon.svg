<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados estilo iOS / Fluent -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Sol com brilho -->
  <circle cx="340" cy="180" r="80" fill="url(#sun)" filter="url(#glow)" />

  <!-- Nuvem estilizada -->
  <path d="M 160 380 L 360 380 A 60 60 0 0 0 360 260 A 80 80 0 0 0 220 230 A 70 70 0 0 0 160 380 Z" fill="url(#cloud)" filter="url(#glow)" />
</svg>
